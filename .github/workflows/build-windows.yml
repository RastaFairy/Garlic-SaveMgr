name: Build Windows

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify toolchain
        shell: pwsh
        run: |
          dotnet --info
          $PSVersionTable

      - name: Build, test and publish
        shell: pwsh
        run: .\build.ps1

      - name: Upload Windows publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: Garlic-SaveMgr-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 14
