name: Build Windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Build and publish
        shell: pwsh
        run: .\build.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Garlic_SaveMgr-v6.8.1-win-x64
          path: publish/Garlic_SaveMgr.exe
